name: Deploy Base Trafalgar Junkyards
on:
  push:
    branches: [main]
    paths:
      - 'base-trafalgar-junkyards/**'
      - '.github/workflows/deploy-base-trafalgar.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: base-trafalgar-junkyards
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
